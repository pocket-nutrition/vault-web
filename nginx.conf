server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a TLS-terminating proxy: keep redirects relative so the scheme is not downgraded.
    absolute_redirect off;

    # This page handles a passphrase and decrypted health data, so it is locked down hard:
    #  - scripts only from this origin (plus WebAssembly, which libsodium needs to run Argon2id), no inline
    #    script or style, no third-party host of any kind;
    #  - the only network destinations are the official vault and, for the EFSA reference table (a GET that
    #    carries nothing about the person), the official API;
    #  - never framed, no referrer, nothing cached.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src https://vault.pocketnutrition.org https://api.pocketnutrition.org; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interrupt-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript;
    gzip_min_length 1024;
}
